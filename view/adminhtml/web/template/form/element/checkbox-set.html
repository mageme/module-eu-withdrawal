<fieldset class="admin__field"
     visible="visible"
     css="$data.additionalClasses"
     attr="'data-index': index">
    <legend class="admin__field-label" if="$data.label" attr="for: uid">
        <span text="label" attr="'data-config-scope': $data.scopeLabel"></span>
    </legend>

    <div class="admin__field-control"
         css="'_with-tooltip': $data.tooltip">
        <div class="message message-warning mm-euw-choice-warning" if="$data.warning">
            <span text="$data.warning"></span>
        </div>

        <div class="admin__field admin__field-option mm-euw-choice"
             outereach="options"
             css="'mm-euw-choice-group': $data.header, 'mm-euw-choice-value': $data.child">
            <span class="mm-euw-choice-title" if="$data.header" text="label"></span>

            <input
                if="!$data.header"
                ko-checked="$parent.value"
                ko-disabled="$parent.disabled"
                css="
                    'admin__control-radio': !$parent.multiple,
                    'admin__control-checkbox': $parent.multiple"
                attr="
                    id: ++ko.uid,
                    value: value,
                    type: $parent.multiple ? 'checkbox' : 'radio'"/>

            <label class="admin__field-label" if="!$data.header" text="label" attr="for: ko.uid"></label>

            <span class="mm-euw-choice-type" if="$data.typeLabel" text="$data.typeLabel"></span>
        </div>

        <label class="admin__field-error" if="error" attr="for: uid" text="error"></label>

        <div class="admin__field-note" if="$data.notice" attr="id: noticeId">
            <span translate="$data.notice"></span>
        </div>

        <render args="$data.service.template" if="$data.hasService()"></render>
    </div>
</fieldset>
